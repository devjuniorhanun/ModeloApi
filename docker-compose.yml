services:
    # image project
    app-modelo-back:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: app-modelo-back
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        networks:
            - modelo-api

    # nginx
    nginx-modelo-back:
        image: nginx:alpine
        container_name: nginx-modelo-back
        restart: unless-stopped
        ports:
            - "81:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/:/etc/nginx/conf.d/
        networks:
            - modelo-api

    # db mysql
    db-modelo-back:
        image: mysql:8.0.44-debian
        container_name: db-modelo-back
        restart: always
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
        volumes:
            - volume-db:/var/lib/mysql
        ports:
            - "3389:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 15s
            retries: 5
            start_period: 5s
        networks:
            - modelo-api

        # PHPMyAdmin
    phpmyadminmodelo-back:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadminmodelo-back
        platform: linux/x86_64
        restart: unless-stopped
        ports:
            - "8081:80"
        environment:
            PMA_HOST: db-modelo-back
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            UPLOAD_LIMIT: 300M
        networks:
            - modelo-api


volumes:
  volume-db:

networks:
    modelo-api:
        driver: bridge